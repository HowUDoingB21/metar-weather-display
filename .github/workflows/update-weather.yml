name: Update Weather Data

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub minimum is 5, but 10 is more reliable)
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Generate weather data and radar image
        run: python backend/generate_data.py
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}

      - name: Commit and push updated files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/HowUDoingB21/metar-weather-display.git
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weather update $(date -u '+%H:%M UTC')"
            git push origin HEAD:master
          fi
